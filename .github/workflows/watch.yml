name: watch

# Notices new Spotify (Windows GA) and Spicetify releases and keeps one issue per combination.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check for releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/watch.mjs
      # Committing state also keeps the schedule alive past GitHub's 60-day inactivity cutoff.
      - name: Commit state
        run: |
          [ -z "$(git status --porcelain state/watch.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/watch.json
          git commit -m "chore(state): record latest Spotify and Spicetify releases"
          git pull --rebase
          git push
